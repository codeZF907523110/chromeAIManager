<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 浏览器管家</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 标题栏 -->
  <header class="header">
    <span class="header-brand">
      <span class="header-icon">◆</span>
      <span class="header-title">AI 浏览器管家</span>
    </span>
    <div class="header-actions">
      <button id="settings-btn" class="header-btn" title="设置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="mode-sidepanel" class="header-btn mode-btn" title="侧边栏模式">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
      </button>
      <button id="mode-popup" class="header-btn mode-btn" title="弹窗模式">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="8.5 12 12 15.5 16.5 11"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 消息展示区 -->
  <div id="messages" class="messages"></div>

  <!-- 设置面板 -->
  <div id="settings-panel" class="settings-panel" style="display: none;">
    <form>
      <label>
        AI 提供者
        <select name="aiProvider">
          <option value="auto">自动（优先本地）</option>
          <option value="gemini-nano">Gemini Nano（本地）</option>
          <option value="openai">OpenAI 兼容 API</option>
        </select>
      </label>
      <label>
        API Key
        <input type="password" name="apiKey" placeholder="sk-...">
      </label>
      <label>
        API 端点
        <input type="text" name="apiEndpoint" placeholder="https://api.deepseek.com">
      </label>
      <label>
        模型名称
        <input type="text" name="modelName" placeholder="deepseek-chat">
      </label>
      <button type="submit">保存设置</button>
    </form>
  </div>

  <!-- 命令输入区 -->
  <div class="command-area">
    <div class="command-wrapper">
      <div class="command-glow"></div>
      <div class="command-input-row">
        <span class="command-prefix">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </span>
        <input
          id="command-input"
          type="text"
          placeholder="输入命令或 /help 查看帮助..."
          autofocus
        >
        <button id="command-submit" class="submit-btn" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="command-decoration">
        <span class="deco-dot"></span>
        <span class="deco-line"></span>
        <span class="deco-dot"></span>
        <span class="deco-line"></span>
        <span class="deco-dot"></span>
        <span class="deco-line"></span>
        <span class="deco-dot"></span>
      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
